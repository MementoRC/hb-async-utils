[workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "osx-64", "win-64"]

[dependencies]
python = ">=3.12,<3.13"
typing_extensions = ">=4.0"

[pypi-dependencies]
hb-logger = { git = "https://github.com/MementoRC/hb-logger.git", rev = "06534b7708a13b4425a06dd154976db96c2c45be" }

[feature.dev.dependencies]
pytest = ">=9.0.3"
pytest-asyncio = ">=0.21.0"
pytest-cov = ">=7.1.0"
pytest-timeout = ">=2.4.0"
ruff = "=0.15.10"
mypy = ">=1.20.0"
pre-commit = ">=2.15.0"

[feature.ci.dependencies]
ruff = "=0.15.10"
mypy = ">=1.20.0"
pytest = ">=9.0.3"
pytest-cov = ">=7.1.0"
pytest-timeout = ">=2.4.0"
bandit = ">=1.8.0"
pre-commit = ">=2.15.0"
hatchling = ">=1.18"

[feature.py312.dependencies]
python = "3.12.*"

[environments]
default = { features = ["dev"], solve-group = "default" }
ci = { features = ["ci", "dev"], solve-group = "default" }
quality-ci = { features = ["ci", "dev"], solve-group = "default" }
py312 = { features = ["py312", "dev"], solve-group = "py312" }

[tasks]
test = "pytest tests/"
test-unit = "pytest tests/unit/"
test-integration = "pytest tests/integration/"
lint = "ruff check async_utils tests"
format = "ruff format async_utils tests"
format-check = "ruff format --check async_utils tests"
typecheck = "mypy async_utils"
build = "hatchling build"
coverage = "pytest tests/ --cov=async_utils --cov-report=term-missing"
quality = { depends-on = ["lint", "format-check"] }
check = { depends-on = ["quality", "typecheck", "test"] }
