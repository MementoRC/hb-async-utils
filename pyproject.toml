[build-system]
requires = ["hatchling>=1.29.0"]
build-backend = "hatchling.build"

[project]
name = "hb-async-utils"
dynamic = ["version"]
description = "Async utility helpers and primitives for Hummingbot sub-packages"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
dependencies = [
    "typing-extensions>=4.0",
    "hb-logger @ git+https://github.com/MementoRC/hb-logger.git@06534b7708a13b4425a06dd154976db96c2c45be",
]

[tool.hatch.metadata]
allow-direct-references = true

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=7.1.0",
    "pytest-timeout>=2.4.0",
    "ruff==0.15.7",
    "mypy>=1.20.0",
]

[tool.hatch.version]
path = "async_utils/__about__.py"

[tool.hatch.build.targets.wheel]
packages = ["async_utils"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
markers = [
    "unit: unit tests",
    "integration: integration tests",
]
timeout = 30
addopts = "--strict-markers --strict-config -v"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP", "N", "SIM", "TCH"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
warn_unused_ignores = true

[tool.coverage.run]
branch = true
source_pkgs = ["async_utils"]
omit = ["async_utils/__about__.py"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
exclude_lines = ["no cov", "if __name__", "if TYPE_CHECKING", "raise NotImplementedError", "@overload"]

[tool.hummingbot.supersedes]
modules = ["async_utils"]
test_paths = [
    "test/hummingbot/core/utils/test_async_utils.py",
    "test/hummingbot/core/utils/test_async_utils_coverage.py",
    "test/hummingbot/core/utils/test_tracking_nonce.py",
    "test/hummingbot/core/utils/test_async_retry.py",
]
