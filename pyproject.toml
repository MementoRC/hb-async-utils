[build-system]
requires = ["hatchling>=1.29.0"]
build-backend = "hatchling.build"

[project]
name = "hb-async-utils"
dynamic = ["version"]
description = "Async utility helpers and primitives for Hummingbot sub-packages"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
dependencies = [
    "typing-extensions>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=7.1.0",
    "pytest-timeout>=2.4.0",
    "ruff==0.15.7",
    "mypy>=1.20.0",
]

[tool.hatch.version]
path = "async_utils/__about__.py"

[tool.hatch.build.targets.wheel]
packages = ["async_utils"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
markers = [
    "unit: unit tests",
    "integration: integration tests",
]
timeout = 30
addopts = "--strict-markers --strict-config -v"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP", "N", "SIM", "TCH"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
warn_unused_ignores = true

[tool.coverage.run]
branch = true
source_pkgs = ["async_utils"]
omit = ["async_utils/__about__.py"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
exclude_lines = ["no cov", "if __name__", "if TYPE_CHECKING", "raise NotImplementedError", "@overload"]

[tool.hummingbot.supersedes]
modules = ["async_utils"]
test_paths = [
    "test/hummingbot/core/utils/test_async_utils.py",
    "test/hummingbot/core/utils/test_async_utils_coverage.py",
    "test/hummingbot/core/utils/test_tracking_nonce.py",
    "test/hummingbot/core/utils/test_async_retry.py",
]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "osx-64", "win-64"]

[tool.pixi.dependencies]
python = ">=3.12,<3.13"
typing_extensions = ">=4.0"

[tool.pixi.feature.dev.dependencies]
pytest = ">=9.0.3"
pytest-asyncio = ">=0.21.0"
pytest-cov = ">=7.1.0"
pytest-timeout = ">=2.4.0"
ruff = "=0.15.7"
mypy = ">=1.20.0"
pre-commit = ">=2.15.0"

[tool.pixi.feature.ci.dependencies]
ruff = "=0.15.7"
mypy = ">=1.20.0"
pytest = ">=9.0.3"
pytest-cov = ">=7.1.0"
pytest-timeout = ">=2.4.0"
bandit = ">=1.8.0"
pre-commit = ">=2.15.0"
hatchling = ">=1.18"

[tool.pixi.feature.py312.dependencies]
python = "3.12.*"

[tool.pixi.environments]
default = { features = ["dev"], solve-group = "default" }
ci = { features = ["ci", "dev"], solve-group = "default" }
quality-ci = { features = ["ci", "dev"], solve-group = "default" }
py312 = { features = ["py312", "dev"], solve-group = "py312" }

[tool.pixi.tasks]
test = "pytest tests/"
test-unit = "pytest tests/unit/"
test-integration = "pytest tests/integration/"
lint = "ruff check async_utils tests"
format = "ruff format async_utils tests"
format-check = "ruff format --check async_utils tests"
typecheck = "mypy async_utils"
build = "hatchling build"
coverage = "pytest tests/ --cov=async_utils --cov-report=term-missing"
quality = { depends-on = ["lint", "format-check"] }
check = { depends-on = ["quality", "typecheck", "test"] }
